spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/farm_ckp}
spring.datasource.username=${DATABASE_USERNAME:farmuser}
spring.datasource.password=${DATABASE_PASSWORD:farmpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
spring.application.name=orchard

logging.level.com.farmckp=INFO
